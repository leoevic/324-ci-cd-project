services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    container_name: video-game-library-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: .env
    container_name: video-game-library-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
