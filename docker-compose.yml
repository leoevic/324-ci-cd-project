services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    container_name: video-game-library-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: .env
    container_name: video-game-library-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

  jenkins:
    build: 
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: video-game-library-jenkins
    user: root
    ports:
      - "127.0.0.1:9000:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

volumes:
  jenkins_home:
